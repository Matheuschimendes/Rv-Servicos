<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- RESPONSIVO -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO PRINCIPAL -->
    <title>
      RV Serviços Médicos | Gestão e Serviços Médicos Especializados
    </title>

    <meta
      name="description"
      content="A RV Serviços Médicos oferece gestão médica especializada, terceirização hospitalar e soluções com foco em eficiência e humanização no atendimento."
    />

    <meta name="robots" content="index, follow" />

    <!-- CANONICAL DEFINIDO -->
    <link rel="canonical" href="https://rvservicosmedicos.com.br/" />

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="RV Serviços Médicos | Gestão Médica Especializada"
    />
    <meta
      property="og:description"
      content="Soluções completas em gestão médica e eficiência hospitalar com foco em humanização."
    />
    <meta property="og:url" content="https://rvservicosmedicos.com.br/" />
    <meta
      property="og:image"
      content="https://rvservicosmedicos.com.br/og-image.jpg"
    />
    <meta property="og:locale" content="pt_BR" />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PERFORMANCE -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- CSS -->
    <link rel="stylesheet" href="/index.css" />

    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: "#005596",
                light: "#00B0FC",
                surface: "#F8FAFC",
                accent: "#00B0FC",
              },
            },
            borderRadius: {
              premium: "1.5rem",
              card: "2rem",
            },
          },
        },
      };
    </script>

    <!-- SCHEMA -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MedicalOrganization",
        "name": "RV Serviços Médicos",
        "url": "https://rvservicosmedicos.com.br",
        "logo": "https://rvservicosmedicos.com.br/logo.png",
        "description": "Empresa especializada em gestão e prestação de serviços médicos com foco em eficiência e humanização.",
        "areaServed": "Brasil"
      }
    </script>
  </head>

  <body class="text-slate-800 font-sans overflow-x-hidden">
    <!-- IMPORTANTE: GARANTA QUE SEU REACT TENHA APENAS UM H1 -->
    <!-- Exemplo ideal dentro do React -->

    <!--
    <h1>Gestão e Serviços Médicos Especializados</h1>
    <p>Soluções completas com eficiência operacional e atendimento humanizado.</p>
    -->

    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
